services:
  db:
    image: postgres:17-alpine
    container_name: junior-il-db
    environment:
      POSTGRES_USER: junior
      POSTGRES_PASSWORD: junior
      POSTGRES_DB: junior_il
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U junior -d junior_il"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
